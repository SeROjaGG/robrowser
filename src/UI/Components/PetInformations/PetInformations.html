<div id="PetInformations" class="sj-panel">
	<div class="titlebar sj-titlebar">
		<div class="left">
			<span class="text" data-text="584">Pet Info</span>
		</div>
		<div class="right">
			<button class="base close sj-winbtn">×</button>
		</div>
		<div class="clear"></div>
	</div>
	<div class="content">
		<div class="title_name">Name</div>
		<input type="text" class="name sj-input" value="" />
		<div class="title_level">Level</div>
		<div class="level"></div>
		<button class="modify sj-btn">Rename</button>

		<div class="title_hunger">Hunger</div>
		<div class="hunger"></div>
		<div class="title_intimacy">Intimacy</div>
		<div class="intimacy"></div>

		<div class="title_accessory">Accessory</div>
		<div class="accessory">Equipped</div>
		<div class="feeding">
			<span data-text="2577">Auto Feeding</span
			><button class="pet_auto_feed" data-background="checkbox_0.bmp" data-preload="checkbox_1.bmp"></button>
		</div>

		<select class="command sj-input">
			<option value="default">&lt; Command &gt;</option>
			<option value="feed" data-text="592">Feed Pet</option>
			<option value="action" data-text="593">Performance</option>
			<option value="release" data-text="594">Return to Egg Shell</option>
			<option value="unequip" data-text="595">Unequip Accessory</option>
		</select>
	</div>
</div>
