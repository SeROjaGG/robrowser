<div id="HomunInformations">
	<div class="content sj-panel">
		<div class="left">
			<span class="text">Homunculus Info</span>
		</div>
		<div class="right">
			<ui-button class="base close sj-winbtn">×</ui-button>
		</div>
		<div class="clear"></div>

		<div class="title_name">Name</div>
		<input type="text" class="name sj-input" value="" />
		<div class="title_level">Level</div>
		<div class="level"></div>

		<ui-button class="modify sj-btn">Rename</ui-button>
		<ui-button class="skill sj-btn">Skills</ui-button>
		<ui-button class="del sj-btn">Delete</ui-button>

		<div class="stats">
			<div class="atk"></div>
			<div class="Matk"></div>
			<div class="hit"></div>
			<div class="critical"></div>
			<div class="def"></div>
			<div class="Mdef"></div>
			<div class="flee"></div>
			<div class="aspd"></div>
		</div>

		<div class="hp_bar sj-bar hp">
			<i class="hp_bar_fill"></i>
			<div class="hp_bar_perc"><span class="hp_value"></span> / <span class="hp_max_value"></span></div>
		</div>
		<div class="hp2"></div>

		<div class="sp_bar sj-bar sp">
			<i class="sp_bar_fill"></i>
			<div class="sp_bar_perc"><span class="sp_value"></span> / <span class="sp_max_value"></span></div>
		</div>
		<div class="sp2"></div>

		<div class="block2">
			<div class="title_exp">
				EXP
				<div class="exp"></div>
			</div>
			<canvas class="life title_exp" width="60" height="5"></canvas>

			<div class="title_hunger">
				Hunger
				<div class="hunger"></div>
			</div>
			<canvas class="life title_hunger" width="60" height="5"></canvas>

			<div class="title_intimacy">
				Intimacy
				<div class="intimacy"></div>
			</div>
		</div>

		<ui-button class="feed sj-btn">Feed</ui-button>
		<div class="feeding">
			<button class="homun_auto_feed" data-background="checkbox_0.bmp" data-preload="checkbox_1.bmp"></button>
			<ui-text msg="2577">Auto Feeding</ui-text>
		</div>

		<!--		<div class="title_accessory">Accessory</div>-->
		<!--		<div class="accessory">Equipped</div>-->
	</div>
</div>
